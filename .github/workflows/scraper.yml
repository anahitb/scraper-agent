name: Bulk Agreement Scraper

on:
  workflow_dispatch:
    inputs:
      providers:
        description: 'Comma-separated provider names (e.g. Spectrum,Xfinity,WOW)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SEARCH_BACKEND: serper
        run: |
          mkdir -p output
          PROVIDERS="${{ github.event.inputs.providers }}"
          if [ -n "$PROVIDERS" ]; then
            ARGS=$(echo "$PROVIDERS" | tr ',' '\n' | sed 's/^/"/;s/$/"/' | tr '\n' ' ')
            eval python main.py $ARGS
          else
            python main.py
          fi

      - name: Upload CSV report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-agreements-csv
          path: output/bulk_agreements.csv
          if-no-files-found: warn

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-agreements-pdfs
          path: output/*.pdf
          if-no-files-found: warn

      - name: Upload unreadable PDFs for manual review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unreadable-pdfs
          path: output/unreadable/
          if-no-files-found: warn

      - name: Upload unreadable PDF log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unreadable-pdfs-log
          path: output/unreadable_pdfs.csv
          if-no-files-found: warn

      - name: Upload full output folder
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-output
          path: output/
          if-no-files-found: warn
